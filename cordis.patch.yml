# Global Figma Desktop MCP integration.
# Installed as a Web Profile bundle so MCP tools and guidance are visible to
# every agent preset unless that preset intentionally restricts its tool set.
- insert:
    - id: figma-mcp-client
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: figma
        transport: streamable-http
        url: http://127.0.0.1:3845/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    - id: figma-mcp-guidance
      name: dsh-figma-local-mcp
